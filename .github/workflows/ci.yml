name: CI

# The Studio is a Windows-first desktop application. Its GUI and VTK coverage
# only executes on a runner with a desktop session, so CI runs on Windows
# rather than the cheaper Linux default: on Linux every Tk test would skip and
# the suite would report a green run with the UI coverage silently missing.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-tests:
    name: Tests (windows-latest, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      # Keep stdout UTF-8 so the captured log survives characters the suite
      # prints, such as "Pooled R²". This affects the runner's stdio only, not
      # how the application reads or writes files.
      PYTHONIOENCODING: utf-8
      # Pick Mesa's software rasteriser explicitly. Left unset, the Windows
      # gallium frontend would also consider the d3d12 driver, which needs
      # dxil.dll and a WARP device; llvmpipe needs neither and reports OpenGL
      # 4.6 Core, well past the 3.2 VTK requires.
      GALLIUM_DRIVER: llvmpipe

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # setup_windows.bat prefers 3.12, then 3.11, then 3.13. CI pins the
      # first preference; README.md and INSTALL.md document all three as
      # supported.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # The runner has no GPU, and Microsoft's System32 opengl32.dll is a GDI
      # stub capped at OpenGL 1.1. VTK 9.7 needs 3.2+, so without this step
      # vtkWin32OpenGLRenderWindow cannot find a usable pixel format, VTK falls
      # back to vtkOSOpenGLRenderWindow, osmesa.dll is absent, and the process
      # dies partway through the suite.
      #
      # Mesa's Windows build is a software WGL implementation: opengl32.dll is a
      # thin frontend whose only non-system import is libgallium_wgl.dll, which
      # contains the llvmpipe rasteriser. Nothing else from the package is
      # needed, and neither DLL wants a Visual C++ redistributable.
      #
      # They go in the interpreter's own directory. That is the application
      # directory for every `python` call in this job, and the application
      # directory is searched ahead of System32, so VTK's load-time import of
      # OPENGL32.dll resolves to Mesa. It is also already on PATH, which covers
      # any implementation VTK loads at run time instead. PATH alone would not
      # be enough: since Python 3.8 an extension module's load-time dependencies
      # are resolved only from the module's own directory, directories added
      # with os.add_dll_directory, the application directory and the system
      # directories -- not from PATH.
      #
      # Source: pal1000/mesa-dist-win, the Windows Mesa build that VTK's own
      # fallback message directs users to. Pinned to a release tag and verified
      # by SHA-256 before anything is extracted. The DLLs are fetched here and
      # never committed to the repository, and nothing about a normal Windows
      # user installation changes: this step exists only on the runner.
      - name: Provide software OpenGL (Mesa llvmpipe)
        shell: bash
        env:
          MESA_VERSION: "26.2.4"
          MESA_SHA256: 351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695
        run: |
          set -euo pipefail
          # Staged outside the checkout, so the workspace the suite runs in and
          # the uploaded log artifact stay exactly what git produced.
          work="$(mktemp -d)"
          name="mesa3d-${MESA_VERSION}-release-msvc.7z"
          url="https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VERSION}/${name}"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --retry-all-errors --output "$work/$name" "$url"
          echo "${MESA_SHA256}  $work/$name" | sha256sum --check --strict
          7z x -y -o"$work/mesa" "$work/$name" x64/opengl32.dll x64/libgallium_wgl.dll
          interpreter_dir=$(python -c "import pathlib, sys; print(pathlib.Path(sys.executable).parent.as_posix())")
          cp "$work/mesa/x64/opengl32.dll" "$work/mesa/x64/libgallium_wgl.dll" "$interpreter_dir"
          # setup-python already puts this directory on PATH; stating it here
          # means the guarantee does not rest on that action's internals.
          echo "$interpreter_dir" >> "$GITHUB_PATH"
          ls -l "$interpreter_dir/opengl32.dll" "$interpreter_dir/libgallium_wgl.dll"

      # The same import check Start Antenna Surrogate Studio.bat runs before it
      # launches. It fails fast and clearly when a wheel is missing or broken,
      # instead of surfacing later as hundreds of confusing test errors.
      - name: Verify the application imports
        run: python -c "import tkinter, customtkinter, numpy, sklearn, scipy, joblib, xgboost, shapely, vtkmodules; from studio.ui import run"

      # Report the implementation VTK actually bound, and stop here if it is
      # not Mesa. Otherwise a provisioning regression would surface as an
      # unexplained crash in whichever test first opens a render window.
      - name: Verify VTK renders on software OpenGL
        run: python .github/scripts/verify_software_opengl.py

      # bash (Git for Windows) is used for pipefail: it keeps the suite's exit
      # code when the output is piped to tee. A PowerShell pipeline would
      # discard it and report a green job for a red suite.
      - name: Run the full test suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt

      # A skipped GUI or VTK test looks identical to a passing one in the exit
      # code, so a silent skip would quietly delete the UI coverage this job
      # exists to provide. The suite skips nothing on a healthy Windows
      # machine, so any skip here is a finding and fails the job. If a skip is
      # ever genuinely unavoidable in CI, add it to this step deliberately with
      # a comment saying which external software is missing and why.
      - name: Verify the suite completed and skipped nothing
        if: always()
        shell: bash
        run: |
          if [ ! -f test-output.txt ]; then
            echo "No test output was captured; the suite did not run." >&2
            exit 1
          fi
          # A crash kills the runner before unittest prints its summary, and a
          # truncated log contains no skips either. Require the summary line, so
          # "zero skipped" can never be read off a run that never finished.
          if ! grep -qE "^Ran [0-9]+ tests" test-output.txt; then
            echo "::error::The suite did not reach its summary line; it crashed or was killed."
            echo "Last 40 lines of output:"
            tail -n 40 test-output.txt
            exit 1
          fi
          skipped=$(grep -c "\.\.\. skipped" test-output.txt || true)
          {
            echo "### Test run"
            echo
            grep -E "^Ran [0-9]+ tests" test-output.txt || true
            echo
            echo "Skipped tests: ${skipped}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$skipped" -ne 0 ]; then
            echo "::error::${skipped} test(s) skipped. GUI and VTK coverage must execute on this runner."
            echo "Skipped tests:"
            grep "\.\.\. skipped" test-output.txt
            {
              echo
              echo "<details><summary>Skipped tests</summary>"
              echo
              echo '```'
              grep "\.\.\. skipped" test-output.txt
              echo '```'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "No tests were skipped; GUI and VTK coverage executed."

      # Kept for every outcome, so a red run can be diagnosed without a rerun.
      - name: Upload the full test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-windows-py312
          path: test-output.txt
          retention-days: 30
          if-no-files-found: warn
